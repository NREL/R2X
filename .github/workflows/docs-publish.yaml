name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs-build.yaml"
      - ".github/workflows/docs-publish.yaml"
      - "docs/**"
      - "src/**"
      - "packages/*/src/**"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: docs-publish-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    # The pinned CI actionlint does not yet support the $/ workflow syntax.
    uses: ./.github/workflows/docs-build.yaml # zizmor: ignore[self-repository]
    with:
      upload-artifact: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # Required: push generated docs to gh-pages
    steps:
      - name: Download built docs artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: docs/dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/dist/
          force_orphan: true
